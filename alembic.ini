# Alembic Configuration for Security Triage System

[alembic]
# Path to migration scripts.
script_location = alembic

# Template used to generate migration files.
file_template = %%(rev)s_%%(slug)s

# Timezone to use when rendering the date within the migration file
# as well as the filename. Defaults to UTC.
timezone = UTC

# Max length of characters to apply to the "slug" field.
truncate_slug_length = 40

# Set to 'true' to run the environment during the 'revision' command,
# regardless of autogenerate.
# revision_environment = false

# Set to 'true' to allow .pyc and .pyo files without a source .py file
# to be detected as revisions in the versions/ directory.
# sourceless = false

# Version path separator; use "os" for os.pathsep.
# version_path_separator = os

# Set to 'true' to search source files recursively in each
# "version_locations" directory.
# recursive_version_locations = false

# The output encoding used when revision files are written from
# script.py.mako.
output_encoding = utf-8

# The database URL is read from the DATABASE_URL environment variable
# in env.py. This value is a fallback only.
sqlalchemy.url = postgresql://triage_user:triage_password@localhost:5432/security_triage


[post_write_hooks]
# Hooks run after a new migration file is generated.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
