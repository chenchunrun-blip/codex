apiVersion: v1
kind: ConfigMap
metadata:
  name: security-triage-config
  namespace: security-triage
  labels:
    app: security-triage
data:
  # Service discovery URLs (using internal Kubernetes DNS)
  DATABASE_URL: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/security_triage"
  REDIS_URL: "redis://:$(REDIS_PASSWORD)@redis:6379/0"
  RABBITMQ_URL: "amqp://$(RABBITMQ_USER):$(RABBITMQ_PASSWORD)@rabbitmq:5672/"

  # Internal service endpoints
  ALERT_INGESTOR_URL: "http://alert-ingestor:8001"
  ALERT_NORMALIZER_URL: "http://alert-normalizer:8002"
  CONTEXT_COLLECTOR_URL: "http://context-collector:8003"
  THREAT_INTEL_AGGREGATOR_URL: "http://threat-intel-aggregator:8004"
  AI_TRIAGE_AGENT_URL: "http://ai-triage-agent:8005"
  SIMILARITY_SEARCH_URL: "http://similarity-search:8006"
  LLM_ROUTER_URL: "http://llm-router:8007"
  WORKFLOW_ENGINE_URL: "http://workflow-engine:8008"
  DECISION_ENGINE_URL: "http://decision-engine:8009"
  NOTIFICATION_SERVICE_URL: "http://notification-service:8010"
  API_GATEWAY_URL: "http://api-gateway:8080"

  # Application settings
  LOG_LEVEL: "INFO"
  ENVIRONMENT: "production"

  # Risk scoring thresholds
  RISK_THRESHOLD_CRITICAL: "90"
  RISK_THRESHOLD_HIGH: "70"
  RISK_THRESHOLD_MEDIUM: "40"
  RISK_THRESHOLD_LOW: "20"
