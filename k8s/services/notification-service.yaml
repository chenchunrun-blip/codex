apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: security-triage
  labels:
    app: security-triage
    component: notification-service
spec:
  type: ClusterIP
  ports:
    - port: 8010
      targetPort: 8010
      protocol: TCP
      name: http
  selector:
    app: security-triage
    component: notification-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: security-triage
  labels:
    app: security-triage
    component: notification-service
    version: latest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: security-triage
      component: notification-service
  template:
    metadata:
      labels:
        app: security-triage
        component: notification-service
        version: latest
    spec:
      containers:
        - name: notification-service
          image: security-triage/notification-service:latest
          ports:
            - containerPort: 8010
              name: http
          envFrom:
            - configMapRef:
                name: security-triage-config
            - secretRef:
                name: security-triage-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8010
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8010
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
