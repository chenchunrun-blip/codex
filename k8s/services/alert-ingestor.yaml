apiVersion: v1
kind: Service
metadata:
  name: alert-ingestor
  namespace: security-triage
  labels:
    app: security-triage
    component: alert-ingestor
spec:
  type: ClusterIP
  ports:
    - port: 8001
      targetPort: 8001
      protocol: TCP
      name: http
  selector:
    app: security-triage
    component: alert-ingestor
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-ingestor
  namespace: security-triage
  labels:
    app: security-triage
    component: alert-ingestor
    version: latest
spec:
  replicas: 2
  selector:
    matchLabels:
      app: security-triage
      component: alert-ingestor
  template:
    metadata:
      labels:
        app: security-triage
        component: alert-ingestor
        version: latest
    spec:
      containers:
        - name: alert-ingestor
          image: security-triage/alert-ingestor:latest
          ports:
            - containerPort: 8001
              name: http
          envFrom:
            - configMapRef:
                name: security-triage-config
            - secretRef:
                name: security-triage-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
