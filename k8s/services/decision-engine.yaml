apiVersion: v1
kind: Service
metadata:
  name: decision-engine
  namespace: security-triage
  labels:
    app: security-triage
    component: decision-engine
spec:
  type: ClusterIP
  ports:
    - port: 8009
      targetPort: 8009
      protocol: TCP
      name: http
  selector:
    app: security-triage
    component: decision-engine
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: decision-engine
  namespace: security-triage
  labels:
    app: security-triage
    component: decision-engine
    version: latest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: security-triage
      component: decision-engine
  template:
    metadata:
      labels:
        app: security-triage
        component: decision-engine
        version: latest
    spec:
      containers:
        - name: decision-engine
          image: security-triage/decision-engine:latest
          ports:
            - containerPort: 8009
              name: http
          envFrom:
            - configMapRef:
                name: security-triage-config
            - secretRef:
                name: security-triage-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8009
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8009
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
