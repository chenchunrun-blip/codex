apiVersion: v1
kind: Service
metadata:
  name: context-collector
  namespace: security-triage
  labels:
    app: security-triage
    component: context-collector
spec:
  type: ClusterIP
  ports:
    - port: 8003
      targetPort: 8003
      protocol: TCP
      name: http
  selector:
    app: security-triage
    component: context-collector
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: context-collector
  namespace: security-triage
  labels:
    app: security-triage
    component: context-collector
    version: latest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: security-triage
      component: context-collector
  template:
    metadata:
      labels:
        app: security-triage
        component: context-collector
        version: latest
    spec:
      containers:
        - name: context-collector
          image: security-triage/context-collector:latest
          ports:
            - containerPort: 8003
              name: http
          envFrom:
            - configMapRef:
                name: security-triage-config
            - secretRef:
                name: security-triage-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
