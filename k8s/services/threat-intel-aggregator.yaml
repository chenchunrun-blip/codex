apiVersion: v1
kind: Service
metadata:
  name: threat-intel-aggregator
  namespace: security-triage
  labels:
    app: security-triage
    component: threat-intel-aggregator
spec:
  type: ClusterIP
  ports:
    - port: 8004
      targetPort: 8004
      protocol: TCP
      name: http
  selector:
    app: security-triage
    component: threat-intel-aggregator
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: threat-intel-aggregator
  namespace: security-triage
  labels:
    app: security-triage
    component: threat-intel-aggregator
    version: latest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: security-triage
      component: threat-intel-aggregator
  template:
    metadata:
      labels:
        app: security-triage
        component: threat-intel-aggregator
        version: latest
    spec:
      containers:
        - name: threat-intel-aggregator
          image: security-triage/threat-intel-aggregator:latest
          ports:
            - containerPort: 8004
              name: http
          envFrom:
            - configMapRef:
                name: security-triage-config
            - secretRef:
                name: security-triage-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
