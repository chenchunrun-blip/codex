apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: security-triage
  labels:
    app: security-triage
    component: api-gateway
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: security-triage
    component: api-gateway
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: security-triage
  labels:
    app: security-triage
    component: api-gateway
    version: latest
spec:
  replicas: 2
  selector:
    matchLabels:
      app: security-triage
      component: api-gateway
  template:
    metadata:
      labels:
        app: security-triage
        component: api-gateway
        version: latest
    spec:
      containers:
        - name: api-gateway
          image: security-triage/api-gateway:latest
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: security-triage-config
            - secretRef:
                name: security-triage-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
